  <body class="bg-[#05060a] text-[#f0f1f3] antialiased selection:bg-[#F6465D]/35 selection:text-white overflow-x-hidden">
    <div class="neon-scanline" aria-hidden="true"></div>
    <div id="neon-particles" aria-hidden="true"></div>
    <div id="root"></div>
    <script>
      /* ── 霓虹粒子层：稀疏漂浮粒子做深空前缀 ── */
      (function() {
        const host = document.getElementById('neon-particles');
        if (!host) return;
        Object.assign(host.style, {
          position: 'fixed', inset: '0', zIndex: '0',
          pointerEvents: 'none', overflow: 'hidden'
        });
        const W = window.innerWidth, H = window.innerHeight;
        const PALETTE = ['#F6465D','#9333EA','#00F5D4','#FBBF24','#3B82F6'];
        const N = Math.max(12, Math.floor((W * H) / 22000));
        for (let i = 0; i < N; i++) {
          const d = document.createElement('span');
          const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
          const size = 1 + Math.random() * 2.5;
          d.style.cssText = `
            position:absolute; left:${Math.random()*100}%; top:${Math.random()*100}%;
            width:${size}px; height:${size}px; border-radius:50%;
            background:${color}; opacity:${(0.25+Math.random()*0.45).toFixed(2)};
            box-shadow: 0 0 ${(6+size*3).toFixed(0)}px ${color};
            animation: neon-float ${(14+Math.random()*26).toFixed(1)}s linear ${(Math.random()*10).toFixed(1)}s infinite;
          `;
          host.appendChild(d);
        }
        const st = document.createElement('style');
        st.textContent = `@keyframes neon-float{0%,100%{transform:translate(0,0);opacity:0.35}50%{transform:translate(20px,-40px);opacity:0.15}}`;
        document.head.appendChild(st);
      })();
    </script>
  </body>
